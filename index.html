<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Tracker</title>
<meta name="description" content="Budget Tracker är en Android-app för att hålla koll på utgifter och budget. Här finns information om appen och dess integritetspolicy.">
<link rel="canonical" href="https://budget-app.antonolsson.se/">
<meta name="robots" content="index, follow">
<style>
  :root { --fg:#1c1c1e; --muted:#5b5b63; --bg:#f6f7f9; --card:#fff; --accent:#4f46e5; --line:#e3e4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#f2f2f7; --muted:#a1a1aa; --bg:#111113; --card:#1c1c1e; --accent:#818cf8; --line:#2c2c2e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:2rem; }
  h1 { margin:0 0 .5rem; font-size:1.75rem; letter-spacing:-0.02em; }
  p { margin:0 0 1rem; color:var(--muted); }
  a { color:var(--accent); }
  .cta { display:inline-block; margin-top:.5rem; padding:.65rem 1rem; background:var(--accent); color:#fff; text-decoration:none; border-radius:8px; font-weight:600; }
  .en { margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Budget Tracker</h1>
    <p>En Android-app för att följa utgifter och hålla en enkel budget. Appen utvecklas av Anton Olsson.</p>
    <p>Paketnamn: <code>com.budgetbrightspark.app</code></p>
    <a class="cta" href="/privacy-policy.html">Integritetspolicy</a>
    <div class="en">
      <p><strong>English.</strong> Budget Tracker is an Android app for tracking expenses and staying on budget, made by Anton Olsson.</p>
      <p><a href="/privacy-policy.html">Privacy policy</a></p>
    </div>
  </div>
</main>
</body>
</html>
