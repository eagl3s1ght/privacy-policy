        a {
            color: var(--primary-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .content {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 10px;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        ul li {
            margin-bottom: 0.5rem;
            padding-left: 1.5rem;
            position: relative;
        }

        ul li::before {
            content: "•";
            color: var(--primary-color);
            position: absolute;
            left: 0;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
        }

        code {
            background: rgba(79, 70, 229, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            margin-left: 0;
            padding-left: 1rem;
            color: rgba(255, 255, 255, 0.8);

    <script>
        // Configure marked options
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true
        });

        // Fetch and render the privacy policy
        fetch('privacy-policy.md')
            .then(response => response.text())
            .then(text => {
                document.getElementById('privacy-policy-content').innerHTML = marked.parse(text);
            })
            .catch(error => {
                console.error('Error loading privacy policy:', error);
                document.getElementById('privacy-policy-content').innerHTML = '<p>Error loading privacy policy. Please try again later.</p>';
            });
